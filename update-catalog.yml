name: Update Supplier Catalog

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours automatically
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch supplier catalog
        env:
          SUPPLIER_TOKEN: ${{ secrets.SUPPLIER_TOKEN }}
        run: python3 fetch_catalog.py

      - name: Commit and push products.json
        run: |
          git config user.name  "Nova Brandly Bot"
          git config user.email "bot@novabrandly.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Update catalog $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
