name: Update Supplier Catalog

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch supplier catalog via Worker
        run: python3 fetch_catalog.py

      - name: Commit and push products.json
        run: |
          git config user.name  "Nova Brandly Bot"
          git config user.email "bot@novabrandly.com"
          git add products.json
          git diff --staged --quiet || git commit -m "Update catalog $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
